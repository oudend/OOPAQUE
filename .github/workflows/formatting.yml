
name: Java Formatting

on:
  pull_request:
    branches:
      - main
      - formatting-enforcement
  push:
    branches:
      - main
      - formatting-enforcement

jobs:
  formatting:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Check formatting
        run: mvn spotless:check

      - name: Build
        run: mvn verify
